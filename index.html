    }

    /* FORCE CHROME TO STOP BLURRING PIXEL ART EDGES */
    #game-container, iframe, canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        
        /* The magical crisp-rendering properties */
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }
</style>

		<canvas id="canvas" style="width: 100%">

		</canvas>
	<!-- FORCE RESUME STUCK MOUSE POINTERS ON CLICK -->
<script>
window.addEventListener('mousedown', function(e) {
    // If the game engine drops clicks, force the browser to re-request mouse lock
    var canvasElement = document.querySelector('canvas') || document.getElementById('canvas');
    if (canvasElement && !document.pointerLockElement) {
        // Breaking the frozen container barrier cleanly
        canvasElement.requestPointerLock = canvasElement.requestPointerLock || canvasElement.webkitRequestPointerLock;
        if (canvasElement.requestPointerLock) {
            canvasElement.requestPointerLock();
        }
    }
});

// Emergency fallback: Pressing the spacebar or middle click releases frozen system locks
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.code === 'Escape') {
        console.log("Forcing input engine buffer reset...");
        document.exitPointerLock = document.exitPointerLock || document.webkitExitPointerLock;
        if (document.exitPointerLock) { document.exitPointerLock(); }
    }
});
</script>
